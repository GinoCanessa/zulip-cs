name: Tests

on:
  push:
    branches: [ main ]
    paths:
    - 'src/**'
    - 'zulip-cs.sln'
    - 'global.json'
    - 'README.md'
    - 'LICENSE'
    - '.github/scripts/**'
    - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
    - 'src/**'
    - 'zulip-cs.sln'
    - 'global.json'
    - 'README.md'
    - 'LICENSE'
    - '.github/scripts/**'
    - '.github/workflows/**'
  workflow_call:
    inputs:
      commit_sha:
        description: Full source commit to build and test
        required: true
        type: string

permissions:
  contents: read

env:
  VSTEST_CONNECTION_TIMEOUT: '300'

jobs:
  build-and-test:
    name: build-and-test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7
      if: ${{ inputs.commit_sha == '' }}

    - uses: actions/checkout@v7
      if: ${{ inputs.commit_sha != '' }}
      with:
        ref: ${{ inputs.commit_sha }}

    - name: Verify exact source commit
      if: ${{ inputs.commit_sha != '' }}
      shell: pwsh
      env:
        EXPECTED_COMMIT: ${{ inputs.commit_sha }}
      run: |
        if ($env:EXPECTED_COMMIT -cnotmatch '^[0-9a-f]{40}\z')
        {
          throw 'Expected a full lowercase commit SHA.'
        }
        $actualCommit = (git rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0 -or $actualCommit -cne $env:EXPECTED_COMMIT)
        {
          throw "Checked out '$actualCommit', expected '$env:EXPECTED_COMMIT'."
        }

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
            11.0.x
            10.0.x
            9.0.x
            8.0.x

    - name: Test release validation scripts
      shell: pwsh
      run: ./.github/scripts/Test-ReleaseScripts.ps1

    - name: Install dependencies
      run: dotnet restore zulip-cs.sln

    - name: Build
      run: dotnet build zulip-cs.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test zulip-cs.sln --configuration Release --no-build --verbosity normal -p:TestTfmsInParallel=false

name: Publish dotnet library to NuGet.org

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate without publishing (for example, v0.0.1-beta.6)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}

    - name: Resolve and validate release identity
      id: release
      shell: pwsh
      env:
        EVENT_NAME: ${{ github.event_name }}
        RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: |
        $arguments = @{ Tag = $env:RELEASE_TAG }
        if ($env:EVENT_NAME -ceq 'release')
        {
          $arguments.ExpectedCommit = $env:GITHUB_SHA
        }
        elseif ($env:EVENT_NAME -cne 'workflow_dispatch')
        {
          throw "Unsupported event '$env:EVENT_NAME'."
        }
        $release = & ./.github/scripts/Test-ReleaseIdentity.ps1 @arguments
        Add-Content $env:GITHUB_OUTPUT "commit=$($release.Commit)"
        Add-Content $env:GITHUB_OUTPUT "version=$($release.Version)"
        Add-Content $env:GITHUB_OUTPUT "tag=$($release.Tag)"

  source-ci:
    name: exact-source-ci
    needs: validate
    uses: ./.github/workflows/build-and-test.yaml
    with:
      commit_sha: ${{ needs.validate.outputs.commit }}

  pack:
    name: pack-release-candidate
    needs: [validate, source-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha512: ${{ steps.candidate.outputs.sha512 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.validate.outputs.commit }}

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x

    - name: Build and pack the tagged version once
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      run: |
        $actualCommit = (git rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0 -or $actualCommit -cne $env:RELEASE_COMMIT)
        {
          throw 'Package checkout does not match the validated commit.'
        }
        $properties = @(
          "-p:Version=$env:RELEASE_VERSION",
          "-p:PackageVersion=$env:RELEASE_VERSION",
          "-p:RepositoryCommit=$env:RELEASE_COMMIT",
          '-p:ContinuousIntegrationBuild=true'
        )
        $project = 'src/zulip-cs-lib/zulip-cs-lib.csproj'
        dotnet restore $project
        if ($LASTEXITCODE -ne 0) { throw 'Release restore failed.' }
        dotnet build $project --configuration Release --no-restore @properties
        if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
        dotnet pack $project --configuration Release --no-build --output "$env:RUNNER_TEMP/release-candidate" @properties
        if ($LASTEXITCODE -ne 0) { throw 'Release pack failed.' }

    - name: Validate candidate and record its hash
      id: candidate
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      run: |
        $hash = & ./.github/scripts/Test-ReleasePackage.ps1 `
          -CandidateDirectory "$env:RUNNER_TEMP/release-candidate" `
          -Version $env:RELEASE_VERSION -Commit $env:RELEASE_COMMIT
        Add-Content $env:GITHUB_OUTPUT "sha512=$hash"
        Add-Content $env:GITHUB_STEP_SUMMARY "Candidate: ``zulip-cs-lib.$env:RELEASE_VERSION.nupkg``; commit: ``$env:RELEASE_COMMIT``; SHA-512: ``$hash``."

    - name: Upload immutable candidate
      id: upload
      uses: actions/upload-artifact@v7
      with:
        name: zulip-cs-lib-${{ needs.validate.outputs.version }}-candidate
        path: ${{ runner.temp }}/release-candidate/*.nupkg
        if-no-files-found: error
        compression-level: 0
        retention-days: 90

  publish:
    name: publish-nuget
    needs: [validate, pack]
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: ${{ needs.validate.outputs.commit }}

    - name: Verify protected publishing environment
      shell: pwsh
      env:
        ENVIRONMENT_READY: ${{ vars.NUGET_PUBLISH_ENVIRONMENT_READY }}
      run: |
        if ($env:ENVIRONMENT_READY -cne 'true')
        {
          throw 'Configure the protected nuget.org environment before publishing.'
        }

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x

    - uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ needs.pack.outputs.artifact_id }}
        path: ${{ runner.temp }}/release-candidate
        merge-multiple: true
        digest-mismatch: error

    - name: Revalidate tag, published release, and exact package
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        EXPECTED_SHA512: ${{ needs.pack.outputs.sha512 }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        & ./.github/scripts/Test-ReleaseIdentity.ps1 `
          -Tag $env:RELEASE_TAG -ExpectedCommit $env:RELEASE_COMMIT
        $releaseJson = gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG"
        if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the published GitHub Release.' }
        $release = $releaseJson | ConvertFrom-Json
        if ($release.draft -or !$release.published_at -or $release.tag_name -cne $env:RELEASE_TAG)
        {
          throw 'The matching GitHub Release must still be published.'
        }
        & ./.github/scripts/Test-ReleasePackage.ps1 `
          -CandidateDirectory "$env:RUNNER_TEMP/release-candidate" `
          -Version $env:RELEASE_VERSION -Commit $env:RELEASE_COMMIT `
          -ExpectedSha512 $env:EXPECTED_SHA512

    - name: Authenticate publication to NuGet.org
      id: nuget
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push the validated package to NuGet.org
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY))
        {
          throw 'NuGet/login did not return a temporary API key.'
        }
        dotnet nuget push "$env:RUNNER_TEMP/release-candidate/zulip-cs-lib.$env:RELEASE_VERSION.nupkg" `
          --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --no-symbols
        if ($LASTEXITCODE -ne 0) { throw 'NuGet publication failed.' }

